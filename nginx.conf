# NGINX sirve la web y reenvía /api a la API. Solo NGINX es visible desde afuera.
# El certificado HTTPS lo proporciona la UDI (Art. 26): aquí se agregaría "listen 443 ssl" y las rutas del certificado.
server {
    listen 80;
    server_name _;
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # IP real del usuario (no se acepta la que mande el cliente)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
