# Levanta todo junto:  docker compose up --build
# Antes, copia .env.example a .env y llena los dos secretos.
services:
  mailpit:                      # Buzón de correo falso para ver los códigos. Solo para pruebas.
    image: axllent/mailpit
    ports:
      - "8025:8025"             # Bandeja: http://localhost:8025

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Clave: ${JWT_CLAVE:?Define JWT_CLAVE en el archivo .env}
      Almacenamiento__ClaveCifradoBase64: ${CLAVE_CIFRADO_BASE64:?Define CLAVE_CIFRADO_BASE64 en el archivo .env}
      Almacenamiento__Ruta: /data/archivos
      Correo__Host: mailpit
      Correo__Puerto: "1025"
      ConfiarEnProxy: "true"
    volumes:
      - archivos:/data/archivos
    depends_on:
      - mailpit

  web:
    image: nginx:alpine
    ports:
      - "8080:80"               # Plataforma: http://localhost:8080
    volumes:
      - ./src/Web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Cuando tu compañero tenga lista la base de datos, aquí va el servicio de PostgreSQL 18:
  # db:
  #   image: postgres:18
  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - datos:/var/lib/postgresql

volumes:
  archivos:
  # datos:
